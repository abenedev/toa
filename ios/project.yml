# XcodeGen spec: `xcodegen generate` (run by CI) creates Toa.xcodeproj.
# ${VAR} values come from the environment at generation time (see codemagic.yaml).
name: Toa
options:
  bundleIdPrefix: dev.abene
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "${TOA_BUILD_NUMBER}"
targets:
  Toa:
    type: application
    platform: iOS
    sources:
      - path: Toa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abene.toa
        PRODUCT_NAME: Toa
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        TOA_API_BASE_URL: "${TOA_API_BASE_URL}"
        TOA_COGNITO_REGION: "${TOA_COGNITO_REGION}"
        TOA_COGNITO_CLIENT_ID: "${TOA_COGNITO_CLIENT_ID}"
        TOA_SUBSCRIPTION_PRODUCT_ID: "${TOA_SUBSCRIPTION_PRODUCT_ID}"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Toa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        TOAAPIBaseURL: $(TOA_API_BASE_URL)
        TOACognitoRegion: $(TOA_COGNITO_REGION)
        TOACognitoClientID: $(TOA_COGNITO_CLIENT_ID)
        TOASubscriptionProductID: $(TOA_SUBSCRIPTION_PRODUCT_ID)
schemes:
  Toa:
    build:
      targets:
        Toa: all
    archive:
      config: Release
