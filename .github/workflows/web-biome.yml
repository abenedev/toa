name: Web Biome

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-biome.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-biome.yml"]

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: biomejs/setup-biome@v2
        with:
          version: latest
      - name: Biome CI
        run: biome ci .
        working-directory: web
