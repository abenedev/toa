# Free compile check (public repo) so Codemagic minutes are only spent on
# builds that compile. No signing, no upload.
name: iOS Build

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        env:
          TOA_BUILD_NUMBER: "1"
          TOA_API_BASE_URL: ""
          TOA_COGNITO_REGION: ""
          TOA_COGNITO_CLIENT_ID: ""
          TOA_SUBSCRIPTION_PRODUCT_ID: ""
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ios/Toa.xcodeproj -scheme Toa -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | xcbeautify
