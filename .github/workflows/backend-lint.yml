name: Backend Lint

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-lint.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-lint.yml"]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ruff format check
        uses: astral-sh/ruff-action@v4
        with:
          src: backend
          args: "format --check"
      - name: Ruff lint
        uses: astral-sh/ruff-action@v4
        with:
          src: backend
          args: "check"
